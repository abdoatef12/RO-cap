name: Build ROSTO APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ROSTOEditor-Android-source.zip"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract ZIP
        run: |
          mkdir project
          unzip -q ROSTOEditor-Android-source.zip -d project

      - name: Build APK
        run: |
          cd project
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ROSTO-Editor-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
