
name: Build ROSTO APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ROSTOEditor-Android-source.zip"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: |
          mkdir project
          unzip -q ROSTOEditor-Android-source.zip -d project

      - name: Fix Java and Kotlin targets
        run: |
          python3 -c "from pathlib import Path; p=Path('project/app/build.gradle.kts'); s=p.read_text(); marker='    }\n}'; replacement='    }\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n    kotlinOptions {\n        jvmTarget = \"17\"\n    }\n}'; assert marker in s, 'Gradle configuration not found'; p.write_text(s.replace(marker, replacement, 1))"

      - name: Build APK
        run: |
          cd project
          gradle assembleDebug

      - name: Verify APK
        run: |
          test -s project/app/build/outputs/apk/debug/app-debug.apk
          ls -lh project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ROSTO-Editor-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
