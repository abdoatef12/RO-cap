
name: Build ROSTO APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ROSTOEditor-Android-source.zip"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -q ROSTOEditor-Android-source.zip -d project
          test -f project/app/build.gradle.kts
          test -f project/app/src/main/java/com/rosto/editor/MainActivity.kt

      - name: Fix Kotlin source
        shell: bash
        run: |
          FILE="project/app/src/main/java/com/rosto/editor/MainActivity.kt"

          sed -i \
            's/import androidx.media3.effect.Effects/import androidx.media3.transformer.Effects/' \
            "$FILE"

          sed -i \
            's/import android.app.Activity/import androidx.activity.ComponentActivity/' \
            "$FILE"

          sed -i \
            's/class MainActivity : Activity()/class MainActivity : ComponentActivity()/' \
            "$FILE"

          echo "Updated Android source imports."

      - name: Configure Java and Kotlin targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("project/app/build.gradle.kts")
          s = p.read_text()

          if "compileOptions {" not in s:
              marker = '        versionName = "0.1.0"\n    }\n}'
              replacement = '''        versionName = "0.1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }'''
              if marker not in s:
                  raise SystemExit("Could not locate Android Gradle configuration")
              s = s.replace(marker, replacement, 1)

          p.write_text(s)
          PY

      - name: Build debug APK
        run: |
          cd project
          gradle assembleDebug

      - name: Verify APK exists
        run: |
          APK="project/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ROSTO-Editor-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
